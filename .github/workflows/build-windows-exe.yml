name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/modulo-rips-948-c80a
      - main
    paths:
      - "MODULO_RIPS_948/**"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: MODULO_RIPS_948
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Create Excel template
        run: python scripts/init_template.py

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile `
            --name ModuloRIPS948 `
            --add-data "config.json;." `
            --add-data "templates/plantilla_relacion.xlsx;templates" `
            --collect-all PySide6 `
            --hidden-import orjson `
            --hidden-import openpyxl `
            app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModuloRIPS948-Windows
          path: MODULO_RIPS_948/dist/ModuloRIPS948.exe
          if-no-files-found: error
